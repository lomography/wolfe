version: 2.1

jobs:
  test:
    parameters:
      ruby:
        type: string
    docker:
      - image: ruby:<< parameters.ruby >>
        environment:
          BUNDLE_FROZEN: "true"
          BUNDLE_WITHOUT: "development"
          BUNDLE_PATH: vendor/bundle
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - gems-ruby<< parameters.ruby >>-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install dependencies
          command: bundle install
      - save_cache:
          key: gems-ruby<< parameters.ruby >>-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Run tests
          command: bundle exec rake test
      - run:
          name: Build gem
          command: gem build wolfe.gemspec

workflows:
  test:
    jobs:
      - test:
          name: test-ruby-<< matrix.ruby >>
          matrix:
            parameters:
              ruby: ["3.3", "3.4", "4.0"]
