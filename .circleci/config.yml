version: 2.1

jobs:
  test:
    parameters:
      ruby:
        type: string
    docker:
      - image: ruby:<< parameters.ruby >>
        environment:
          BUNDLE_FROZEN: "true"
          BUNDLE_WITHOUT: "development"
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bundle install
      - run:
          name: Run tests
          command: bundle exec rake test
      - run:
          name: Build gem
          command: gem build wolfe.gemspec

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              ruby: ["3.3", "3.4", "4.0"]
