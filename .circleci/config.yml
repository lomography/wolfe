version: 2.1

jobs:
  test:
    docker:
      - image: ruby:4.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bundle install
      - run:
          name: Run tests
          command: bundle exec rake test
      - run:
          name: Build gem
          command: gem build wolfe.gemspec

workflows:
  test:
    jobs:
      - test
